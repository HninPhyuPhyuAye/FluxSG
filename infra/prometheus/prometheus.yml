global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: fluxsg-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: fluxsg-worker
    static_configs:
      - targets: ["worker:9100"]
