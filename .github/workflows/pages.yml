name: Deploy public dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment: forecast-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - name: Restore official PSI archive
        id: psi-history-cache
        uses: actions/cache@v6
        with:
          path: |
            ml/data/raw/nea-psi-2023.csv
            ml/data/raw/nea-psi-2024.csv
            ml/data/raw/manifest.json
          key: nea-psi-history-2023-2024-v1
      - name: Build guarded forecast manifest
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          pip install -e ml
          if [[ "${{ steps.psi-history-cache.outputs.cache-hit }}" != "true" ]]; then
            fluxsg-forecast fetch --output-dir ml/data/raw
          fi
          fluxsg-forecast fetch-live --output ml/data/raw/nea-psi-live.csv --lookback-days 9
          fluxsg-forecast train --input-dir ml/data/raw --output-dir ml/artifacts/latest
          fluxsg-forecast publish \
            --input ml/data/raw/nea-psi-live.csv \
            --model ml/artifacts/latest/model.joblib \
            --reference ml/artifacts/latest/training_reference.json \
            --metrics ml/artifacts/latest/metrics.json \
            --output apps/web/public/data/forecast.json
      - uses: actions/upload-artifact@v7
        with:
          name: forecast-evidence-${{ github.run_id }}
          path: |
            apps/web/public/data/forecast.json
            ml/artifacts/latest/metrics.json
            ml/artifacts/latest/drift_report.json
          retention-days: 30
      - run: pnpm --filter @fluxsg/web build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_FLUXSG_API_URL: ${{ vars.FLUXSG_API_URL }}
          NEXT_PUBLIC_FLUXSG_BASE_PATH: /FluxSG
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
