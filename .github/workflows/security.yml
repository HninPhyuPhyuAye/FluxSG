name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pip install pip-audit==2.10.1
      - name: Audit installed API and forecasting environments
        run: |
          python -m venv /tmp/fluxsg-audit
          /tmp/fluxsg-audit/bin/pip install -e services/api -e ml pip-audit==2.10.1
          /tmp/fluxsg-audit/bin/pip freeze | grep -v '^-e ' > /tmp/fluxsg-audit/requirements.txt
          /tmp/fluxsg-audit/bin/pip-audit --strict --requirement /tmp/fluxsg-audit/requirements.txt
      - name: Audit installed warehouse environment
        run: |
          python -m venv /tmp/warehouse-audit
          /tmp/warehouse-audit/bin/pip install -r warehouse/requirements.txt pip-audit==2.10.1
          /tmp/warehouse-audit/bin/pip freeze > /tmp/warehouse-audit/requirements.txt
          /tmp/warehouse-audit/bin/pip-audit --strict --requirement /tmp/warehouse-audit/requirements.txt
