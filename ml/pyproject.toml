[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxsg-forecasting"
version = "0.1.0"
description = "Honest one-hour regional PSI forecasting for FluxSG"
requires-python = ">=3.13"
dependencies = [
  "httpx==0.28.1",
  "joblib==1.6.0",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[project.scripts]
fluxsg-forecast = "fluxsg_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
