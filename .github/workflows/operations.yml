name: Production smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API health
        run: curl --fail --show-error --silent --retry 3 https://fluxsg-api.vercel.app/health | jq -e '.status == "ok"'
      - name: Validate forecast delivery contract
        run: |
          curl --fail --show-error --silent --retry 3 \
            https://fluxsg-api.vercel.app/api/v1/forecast/psi \
            | jq -e '
                .schema_version == 1 and
                (.status == "available" or .status == "withheld") and
                (.checks | type == "object") and
                (.model.test_mae | type == "number")
              '
      - name: Check public dashboard
        run: curl --fail --show-error --silent --retry 3 --output /dev/null https://hninphyuphyuaye.github.io/FluxSG/
