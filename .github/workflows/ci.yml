name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fluxsg
          POSTGRES_USER: fluxsg
          POSTGRES_PASSWORD: fluxsg-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxsg -d fluxsg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DBT_HOST: 127.0.0.1
      DBT_PORT: 5432
      DBT_USER: fluxsg
      DBT_PASSWORD: fluxsg-local
      DBT_DATABASE: fluxsg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: warehouse/requirements.txt
      - run: pip install -r warehouse/requirements.txt
      - run: python warehouse/tools/load_bronze.py --fixture-dir warehouse/fixtures
      - run: dbt build --project-dir warehouse --profiles-dir warehouse
      - run: dbt source freshness --project-dir warehouse --profiles-dir warehouse
      - run: dbt docs generate --project-dir warehouse --profiles-dir warehouse

  forecasting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e 'ml[dev]'
      - run: ruff check ml/src ml/tests
      - run: ruff format --check ml/src ml/tests
      - run: pytest ml/tests
