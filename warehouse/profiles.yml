fluxsg:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'fluxsg') }}"
      password: "{{ env_var('DBT_PASSWORD', 'fluxsg-local') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'fluxsg') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
